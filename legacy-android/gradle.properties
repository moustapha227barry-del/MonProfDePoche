# Mémoire allouée à Gradle (2 Go suffisent largement pour ce projet).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilation parallèle des modules et cache local : builds plus rapides.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX est obligatoire pour Jetpack Compose.
android.useAndroidX=true

# Style de code officiel Kotlin.
kotlin.code.style=official
